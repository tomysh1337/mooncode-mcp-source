<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoonCode Web</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#10141b;color:#e0e6f0}body{max-width:960px;margin:40px auto;padding:0 20px}h1{font-size:28px}small{color:#9aa9bf}section{background:#1a2230;border:1px solid #344155;border-radius:12px;padding:20px;margin:20px 0}textarea{box-sizing:border-box;width:100%;padding:14px;min-height:100px;background:#10141b;color:inherit;border:1px solid #506078;border-radius:8px;font:inherit}button{background:#81c9f5;color:#10212e;border:0;border-radius:6px;padding:10px 18px;margin:10px 8px 0 0;cursor:pointer}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 ui-monospace,monospace}article{border-top:1px solid #344155;margin-top:16px;padding-top:12px}img{max-width:100%}#status{color:#81c9f5}
</style>
<h1>MoonCode Web</h1><small>项目 skills · ChatGPT 网页 · 独立子任务 · 浏览器与 Linux 桌面</small>
<section><div id="status">正在读取项目…</div><pre id="skills"></pre><button id="connect">配置 ChatGPT MCP 连接</button></section>
<section><label for="request">发送任务</label><textarea id="request" placeholder="描述任务，主 agent 会选择项目 skill 并按需创建子任务"></textarea><button id="send">发送</button><button id="stop" disabled>停止</button></section>
<section id="output" aria-live="polite"></section>
<script>
const token=new URLSearchParams(location.hash.slice(1)).get('token')||sessionStorage.getItem('mooncode-token');
if(token)sessionStorage.setItem('mooncode-token',token);history.replaceState(null,'',location.pathname);
const $=id=>document.getElementById(id);let controller;const messages=new Map();
async function api(path,body,signal){const r=await fetch(path,{method:body?'POST':'GET',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:body?JSON.stringify(body):undefined,signal});if(!r.ok)throw new Error((await r.json()).error);return r}
function note(text){const p=document.createElement('p');p.textContent=text;$('output').append(p)}
function event(type,value){if(type==='agent.started'){note('子任务 '+value.agentId.slice(0,8)+' · '+value.link.kind);return}if(type==='delta'||type==='replace'){let p=messages.get(value.agentId);if(!p){p=document.createElement('pre');$('output').append(p);messages.set(value.agentId,p)}p.textContent=type==='replace'?value.text:p.textContent+value.text}else if(type==='message.done'){messages.delete(value.agentId)}else if(type==='action'){note('执行 '+value.action.type+(value.action.name?' · '+value.action.name:''))}else if(type==='action.result'){for(const c of value.result?.content||[])if(c.type==='image'){const img=new Image();img.src='data:'+c.mimeType+';base64,'+c.data;$('output').append(img)}}else if(type==='error')throw new Error(value.error)}
$('send').onclick=async()=>{controller=new AbortController();$('send').disabled=true;$('stop').disabled=false;messages.clear();$('status').textContent='正在处理任务';try{const r=await api('/api/chat',{message:$('request').value},controller.signal);const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let i;while((i=buffer.indexOf('\n\n'))>=0){const block=buffer.slice(0,i);buffer=buffer.slice(i+2);const type=block.match(/^event: (.+)$/m)?.[1],data=block.match(/^data: (.+)$/m)?.[1];if(type&&data)event(type,JSON.parse(data))}}$('status').textContent='任务结束'}catch(e){$('status').textContent=e.name==='AbortError'?'已停止':e.message}finally{$('send').disabled=false;$('stop').disabled=true}};
$('stop').onclick=()=>controller?.abort();$('connect').onclick=async()=>{$('connect').disabled=true;try{$('status').textContent='正在配置连接';const result=await(await api('/api/connect',{})).json();$('status').textContent='已在页面确认连接：'+result.link.url}catch(e){$('status').textContent=e.message}finally{$('connect').disabled=false}};
api('/api/skills').then(r=>r.json()).then(s=>{$('skills').textContent=s.map(x=>x.name+' — '+x.path).join('\n')||'项目中没有发现 skills';$('status').textContent='就绪'}).catch(e=>$('status').textContent=e.message);
</script></html>
